<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily football and basketball board. Fill a row to open the next, harder one.">
<meta name="theme-color" content="#F2CDBF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
<title>Ball Knowledge — the daily board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<a class="skip" href="#board">Skip to the board</a>

<div class="topbar">
  <header class="masthead">
    <h1><span>Ball</span><span>Knowledge</span></h1>
    <div class="dek">
      <span id="issue">No. 001</span>
      <span id="streak"></span>
      <span>Football × NBA</span>
    </div>
  </header>

  <div class="strap">
    <span id="strap-rules">Fill a row to open the next.</span>
    <span class="strap-hint">Tap a heading for <b>what counts</b></span>
  </div>
</div>

<main>
  <div class="board" id="board"></div>

  <section class="result" id="result" aria-live="polite">
    <h2 id="verdict"></h2>
    <p id="blurb"></p>
    <pre class="share" id="share"></pre>
    <button class="act act-dark" id="copy" type="button">Copy result</button>
    <div class="record" id="record"></div>
    <div class="reveal" id="reveal"></div>
  </section>
</main>

<div class="bar">
  <span class="pill">Guesses left<b id="left">15</b></span>
  <span class="pill">Rarity score<b id="score">0</b></span>
  <button class="act" id="next" type="button">New board</button>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="prompt" hidden>
  <div class="q" id="prompt"></div>
  <label class="sr-only" for="search">Athlete name</label>
  <input id="search" type="text" role="combobox" aria-expanded="false" aria-controls="sugg"
         aria-autocomplete="list" autocomplete="off" autocapitalize="off" autocorrect="off"
         spellcheck="false" placeholder="Type a name…">
  <ul id="sugg" role="listbox" aria-label="Matching athletes"></ul>
  <p class="hint" id="hint">Pick from the list. A wrong name costs a guess.</p>
  <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">Esc</button>
</div>

<div class="sheet info" id="info" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
  <h2 class="info-title" id="info-title"></h2>
  <p class="info-kind" id="info-kind"></p>
  <p class="info-body" id="info-body"></p>
  <button class="sheet-close" id="info-close" type="button" aria-label="Close">Esc</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
